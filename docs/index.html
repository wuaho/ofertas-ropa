<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Ofertas de hoy · hombre</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --ink: #141414; --muted: #77746e; --line: #e4e1db;
    --accent: #c8102e; --new: #0b6e4f; --chip: #ebe8e2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --card: #1c1c1c; --ink: #f2f0ec; --muted: #9a968f; --line: #2c2c2c; --chip: #262626; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 12px 14px 10px; padding-top: max(12px, env(safe-area-inset-top)); }
  h1 { font-size: 20px; letter-spacing: .02em; margin: 0; font-weight: 700; text-transform: uppercase; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  input[type=search], select, input[type=text] {
    flex: 1; min-width: 0; font: inherit; padding: 9px 11px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  select { flex: 0 0 auto; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid transparent; background: var(--chip); color: var(--ink);
          padding: 6px 11px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed=true] { background: var(--ink); color: var(--bg); }
  .chip .n { opacity: .6; margin-left: 4px; font-size: 12px; }
  .chips.brands .chip { background: transparent; border-color: var(--line); font-size: 12px; padding: 5px 10px; }
  .chips.brands .chip[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .brand-label { flex: 0 0 auto; align-self: center; font-size: 12px; color: var(--muted); padding-right: 2px; }
  details { margin-top: 8px; font-size: 13px; }
  summary { cursor: pointer; color: var(--muted); }
  .filters { display: grid; gap: 10px; padding: 10px 0 4px; }
  .filters label { display: flex; align-items: center; gap: 8px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  main { padding: 12px 10px 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .card { background: var(--card); border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit;
          display: flex; flex-direction: column; border: 1px solid var(--line); position: relative; }
  .img { aspect-ratio: 3/4; background: var(--chip); width: 100%; object-fit: cover; display: block; }
  .badges { position: absolute; top: 8px; left: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
  .b { font-size: 11px; font-weight: 700; padding: 3px 6px; border-radius: 6px; color: #fff; background: var(--accent); }
  .b.new { background: var(--new); }
  .b.drop { background: #1d4ed8; }
  .b.stale { background: #666; }
  .body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .store { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .name { font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .price { margin-top: auto; padding-top: 4px; display: flex; gap: 6px; align-items: baseline; }
  .now { font-weight: 700; color: var(--accent); font-size: 15px; }
  .old { color: var(--muted); text-decoration: line-through; font-size: 12px; }
  .sizes { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .more { display: block; margin: 16px auto 0; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line);
          background: var(--card); color: var(--ink); font: inherit; cursor: pointer; }
  .warn { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Ofertas de hoy</h1>
  <div class="meta" id="meta">Cargando…</div>
  <div class="row">
    <input type="search" id="q" placeholder="Buscar: chaqueta, lana, mocasín…" autocomplete="off">
    <select id="sort" aria-label="Ordenar">
      <option value="discount">Más descuento</option>
      <option value="price">Más barato</option>
      <option value="new">Nuevas primero</option>
      <option value="saving">Más ahorro (€)</option>
    </select>
  </div>
  <div class="chips" id="stores"></div>
  <div class="chips brands" id="brands" hidden></div>
  <div class="chips" id="tipos"></div>
  <details>
    <summary>Más filtros</summary>
    <div class="filters">
      <label>Descuento mín. <input type="range" id="minDisc" min="0" max="70" step="5" value="0"> <span id="minDiscV">0%</span></label>
      <label>Precio máx. <input type="range" id="maxPrice" min="10" max="200" step="5" value="200"> <span id="maxPriceV">sin límite</span></label>
      <label>Mis tallas <input type="text" id="mySizes" placeholder="p. ej. M, L, 32, 43"></label>
      <label><input type="checkbox" id="onlyNew"> Solo nuevas de hoy</label>
    </div>
  </details>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No hay ofertas con estos filtros.</div>
  <button class="more" id="more" hidden>Ver más</button>
</main>
<script>
(() => {
  const PAGE = 60;
  const $ = (id) => document.getElementById(id);
  const store = (() => { try { return window.localStorage; } catch { return null; } })();
  const saved = (() => { try { return JSON.parse(store?.getItem("ofertas-filtros") || "{}"); } catch { return {}; } })();
  const state = {
    q: "", sort: saved.sort || "discount", stores: new Set(saved.stores || []), tipos: new Set(), brands: new Set(),
    minDisc: saved.minDisc || 0, maxPrice: saved.maxPrice || 200, mySizes: saved.mySizes || "", onlyNew: false, shown: PAGE,
  };
  let deals = [];

  const eur = (n) => n.toLocaleString("es-ES", { style: "currency", currency: "EUR" });
  const norm = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function persist() {
    try {
      store?.setItem("ofertas-filtros", JSON.stringify({
        sort: state.sort, stores: [...state.stores], minDisc: state.minDisc, maxPrice: state.maxPrice, mySizes: state.mySizes,
      }));
    } catch {}
  }

  function sizeMatch(d, wanted) {
    if (!wanted.length || d.sizes == null) return true; // si la tienda no da tallas, no la escondemos
    const have = d.sizes.map((s) => norm(s).trim());
    return wanted.some((w) => have.includes(w));
  }

  function filtered() {
    const terms = norm(state.q).split(/\s+/).filter(Boolean);
    const wanted = state.mySizes.split(/[,\s]+/).map((s) => norm(s)).filter(Boolean);
    const list = deals.filter((d) =>
      (!state.stores.size || state.stores.has(d.store)) &&
      (!state.tipos.size || state.tipos.has(d.tipo)) &&
      (!state.brands.size || !d.brand || state.brands.has(d.brand)) &&
      d.discount >= state.minDisc &&
      (state.maxPrice >= 200 || d.price <= state.maxPrice) &&
      (!state.onlyNew || d.new) &&
      sizeMatch(d, wanted) &&
      terms.every((t) => d._text.includes(t))
    );
    const by = {
      discount: (a, b) => b.discount - a.discount || a.price - b.price,
      price: (a, b) => a.price - b.price,
      new: (a, b) => (b.new - a.new) || (b.first_seen || "").localeCompare(a.first_seen || "") || b.discount - a.discount,
      saving: (a, b) => (b.old_price - b.price) - (a.old_price - a.price),
    }[state.sort];
    return list.sort(by);
  }

  function card(d) {
    const badges = [`<span class="b">-${d.discount}%</span>`];
    if (d.new) badges.push(`<span class="b new">NUEVA</span>`);
    if (d.price_drop) badges.push(`<span class="b drop">BAJA MÁS</span>`);
    if (d.stale) badges.push(`<span class="b stale">de ayer</span>`);
    const sizes = d.sizes == null ? "" : d.sizes.length ? `Tallas: ${d.sizes.map(esc).join(" · ")}` : "Sin tallas disponibles";
    const img = d.image
      ? `<img class="img" loading="lazy" referrerpolicy="no-referrer" src="${esc(d.image)}" alt="" onerror="this.style.visibility='hidden'">`
      : `<div class="img"></div>`;
    return `<a class="card" href="${esc(d.url)}" target="_blank" rel="noopener">
      ${img}<div class="badges">${badges.join("")}</div>
      <div class="body">
        <div class="store">${esc(d.store_name)}${d.brand ? " · " + esc(d.brand) : ""}</div>
        <div class="name">${esc(d.name)}</div>
        ${sizes ? `<div class="sizes">${sizes}</div>` : ""}
        <div class="price"><span class="now">${eur(d.price)}</span><span class="old">${eur(d.old_price)}</span></div>
      </div></a>`;
  }

  function chips(el, values, active, counts, onToggle) {
    el.innerHTML = values.map((v) =>
      `<button class="chip" data-v="${esc(v.id)}" aria-pressed="${active.has(v.id)}">${esc(v.label)}<span class="n">${counts[v.id] || 0}</span></button>`
    ).join("");
    el.onclick = (e) => {
      const b = e.target.closest(".chip"); if (!b) return;
      const v = b.dataset.v;
      active.has(v) ? active.delete(v) : active.add(v);
      onToggle();
    };
  }

  function render() {
    const list = filtered();
    $("grid").innerHTML = list.slice(0, state.shown).map(card).join("");
    $("empty").hidden = list.length > 0;
    const remaining = list.length - state.shown;
    $("more").hidden = remaining <= 0;
    $("more").textContent = remaining <= PAGE ? `Ver ${remaining} más` : `Ver ${PAGE} más (quedan ${remaining})`;
    const countBy = (k) => deals.reduce((m, d) => (m[d[k]] = (m[d[k]] || 0) + 1, m), {});
    const storeList = [...new Map(deals.map((d) => [d.store, { id: d.store, label: d.store_name }])).values()];
    const tipoCounts = countBy("tipo");
    const tipoList = Object.keys(tipoCounts).sort((a, b) => tipoCounts[b] - tipoCounts[a]).map((t) => ({ id: t, label: t }));
    chips($("stores"), storeList, state.stores, countBy("store"), () => { state.shown = PAGE; persist(); render(); });
    chips($("tipos"), tipoList, state.tipos, tipoCounts, () => { state.shown = PAGE; render(); });
    // Burbujas de marca: solo cuando hay tiendas multimarca seleccionadas (ASOS, Zalando)
    const inStores = deals.filter((d) => d.brand && state.stores.has(d.store));
    const brandCounts = inStores.reduce((m, d) => (m[d.brand] = (m[d.brand] || 0) + 1, m), {});
    for (const b of [...state.brands]) if (!brandCounts[b]) state.brands.delete(b);
    const brandList = Object.keys(brandCounts).sort((a, b) => brandCounts[b] - brandCounts[a]).map((b) => ({ id: b, label: b }));
    $("brands").hidden = brandList.length === 0;
    if (brandList.length) {
      chips($("brands"), brandList, state.brands, brandCounts, () => { state.shown = PAGE; render(); });
      $("brands").insertAdjacentHTML("afterbegin", '<span class="brand-label">Marcas:</span>');
    }
    $("minDiscV").textContent = `${state.minDisc}%`;
    $("maxPriceV").textContent = state.maxPrice >= 200 ? "sin límite" : eur(state.maxPrice);
  }

  function bind() {
    const set = (k, v) => { state[k] = v; state.shown = PAGE; persist(); render(); };
    $("q").oninput = (e) => set("q", e.target.value);
    $("sort").value = state.sort; $("sort").onchange = (e) => set("sort", e.target.value);
    $("minDisc").value = state.minDisc; $("minDisc").oninput = (e) => set("minDisc", +e.target.value);
    $("maxPrice").value = state.maxPrice; $("maxPrice").oninput = (e) => set("maxPrice", +e.target.value);
    $("mySizes").value = state.mySizes; $("mySizes").oninput = (e) => set("mySizes", e.target.value);
    $("onlyNew").onchange = (e) => set("onlyNew", e.target.checked);
    $("more").onclick = () => { state.shown += PAGE; render(); };
  }

  fetch("deals.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((data) => {
      deals = data.deals.map((d) => ({ ...d, _text: norm(`${d.name} ${d.category} ${d.tipo} ${d.store_name} ${d.brand || ""} ${(d.colors || []).join(" ")}`) }));
      const when = new Date(data.updated_at).toLocaleString("es-ES", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      const nNew = deals.filter((d) => d.new).length;
      const failed = Object.values(data.stores).filter((s) => !s.ok).map((s) => s.name);
      $("meta").innerHTML = `${deals.length} ofertas · ${nNew} nuevas · actualizado ${esc(when)}` +
        (failed.length ? ` · <span class="warn">sin datos nuevos de ${esc(failed.join(", "))}</span>` : "");
      bind(); render();
    })
    .catch(() => { $("meta").textContent = "No se pudo cargar deals.json"; });
})();
</script>
</body>
</html>
